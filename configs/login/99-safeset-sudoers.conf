# Managed by safeset (safesetsh). Concentrate access through a hardened
# guest account if no dedicated operator user was specified.
Defaults use_pty
Defaults logfile=/var/log/sudo.log
Defaults log_input, log_output
Defaults timestamp_timeout=5
Defaults passwd_tries=3
Defaults env_reset
Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# Require re-authentication for privileged commands within a session.
Defaults !visiblepw

# Managed by safeset (safesetsh). Included from /etc/nginx/nginx.conf (http
# context). Adds request/connection limits, bot and scanner-path maps, and
# disables version disclosure.

server_tokens off;

client_max_body_size 8m;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
send_timeout 15s;
large_client_header_buffers 4 8k;
reset_timedout_connection on;

limit_req_zone $binary_remote_addr zone=safeset_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=safeset_conn:10m;

# Known tooling / scanner user agents.
map $http_user_agent $safeset_badbot {
	default 0;
	~*(nikto|sqlmap|nmap|masscan|acunetix|nessus|openvas|dirbuster|gobuster|wfuzz|zgrab|feroxbuster|nuclei) 1;
	~*(python-requests|python-urllib|go-http-client|libwww-perl|curl/7|wget/1) 1;
}

# Requests for common secrets / admin panels.
map $request_uri $safeset_badpath {
	default 0;
	~*(/\.env|/\.git|/\.svn|/wp-login\.php|/wp-admin|/xmlrpc\.php|/phpmyadmin|/pma|/myadmin|/administrator|/\.aws|/\.ssh|/actuator|/vendor/phpunit|/config\.php\.bak) 1;
}

# warn level is required for fail2ban nginx jails to see the entries.
error_log /var/log/nginx/error.log warn;

# Managed by safeset (safesetsh). Apache security hardening.
# Enabled via: a2enconf safeset-security

ServerTokens Prod
ServerSignature Off
TraceEnable Off
LimitRequestBody 8388608

<IfModule mod_headers.c>
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
	# Conservative CSP placeholder: adjust for your application.
	Header always set Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
	Header unset X-Powered-By
</IfModule>

<IfModule mod_reqtimeout.c>
	RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# Deny requests for common secrets / admin panels (403, logged for fail2ban).
<IfModule mod_rewrite.c>
	RewriteEngine On
	RewriteCond %{REQUEST_URI} (\.env|\.git|\.svn|wp-login\.php|xmlrpc\.php|phpmyadmin|/pma|/myadmin|/administrator|\.aws|\.ssh|/actuator|/vendor/phpunit) [NC]
	RewriteRule ^ - [F]
</IfModule>

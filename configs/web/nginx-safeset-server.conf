# Managed by safeset (safesetsh). Included inside every nginx server block by
# /etc/nginx/snippets/safeset-server.conf. Do not edit; replaced on each run.

# Security headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP is a conservative placeholder: adjust for your application.
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

# Rate / connection limits.
limit_req zone=safeset_req burst=20 nodelay;
limit_conn safeset_conn 20;

# Drop scanner traffic (444 = close without response) — logged for fail2ban.
if ($safeset_badbot) { return 444; }
if ($safeset_badpath) { return 444; }
if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

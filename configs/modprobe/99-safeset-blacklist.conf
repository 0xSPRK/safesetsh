# Managed by safeset (safesetsh). Blacklist of uncommon and risky kernel
# modules / filesystems not needed on a hardened server. Takes effect for
# module autoload; already-loaded modules are removed after reboot.

# --- Exotic filesystems (commonly used in exploit chains) ---
install cramfs /bin/true
install freevxfs /bin/true
install hfs /bin/true
install hfsplus /bin/true
install jffs2 /bin/true
install udf /bin/true

# --- Uncommon network protocols ---
install dccp /bin/true
install dccp_ipv4 /bin/true
install dccp_ipv6 /bin/true
install sctp /bin/true
install sctp_ipv6 /bin/true
install rds /bin/true
install rds_tcp /bin/true
install tipc /bin/true
install ax25 /bin/true
install netrom /bin/true
install rose /bin/true
install x25 /bin/true
install atm /bin/true

# --- Wireless / bluetooth on a server is rarely needed ---
install bluetooth /bin/true
install bnep /bin/true
install rfcomm /bin/true

# --- USB mass storage (physical access vector on servers) ---
install usb-storage /bin/true

blacklist cramfs
blacklist freevxfs
blacklist hfs
blacklist hfsplus
blacklist jffs2
blacklist udf
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist ax25
blacklist netrom
blacklist rose
blacklist x25
blacklist atm
blacklist bluetooth
blacklist usb-storage

# Managed by safeset (safesetsh). Kernel & network hardening (CIS L1 + Lynis).
# Every knob has a one-line justification.

### --- IPv4 network -------------------------------------------------------

# Strict reverse-path filtering: drop packets arriving on an interface that
# could not legitimately be sent out of it (anti-spoofing).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Never honor source routing (LSRR/SSRR) — classic spoofing/redirect vector.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Do not accept ICMP redirects: prevents cache-poisoning of the routing table
# by an on-path attacker.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Do not send ICMP redirects (this host is not a router).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Log packets with impossible source addresses (martians) for detection.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast ICMP echo — mitigates smurf amplification.
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore invalid ICMP error responses (RFC 1122 compliance, anti-scan).
net.ipv4.icmp_ignore_bogus_error_responses = 1

# SYN cookies: SYN-flood resistance without huge SYN queues.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

# Faster drop of half-open connections.
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_max_tw_buckets = 20000

# Ignore ICMP echo requests when asked to (sysctl knob, normally left 0).
net.ipv4.icmp_echo_ignore_all = 0

### --- IPv6 network -------------------------------------------------------

net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Accept Router Advertisements only when acting as a host is required;
# servers on fixed addressing do not need RA (0 = ignore RA).
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

### --- Kernel / process ---------------------------------------------------

# Never expose kernel pointers in dmesg or /proc (except for CAP_SYSLOG).
kernel.kptr_restrict = 2

# Restrict dmesg to privileged users — hides kernel addresses/paths.
kernel.dmesg_restrict = 1

# Yama: restrict ptrace to child processes only (anti-debugging of others).
kernel.yama.ptrace_scope = 1

# Disable unprivileged BPF (eBPF attack surface for LPE).
kernel.unprivileged_bpf_disabled = 1

# Disallow unprivileged user namespaces (common LPE escape hatch on Debian).
kernel.unprivileged_userns_clone = 0

# Full ASLR (stack, VDSO, shared libs, mmap).
kernel.randomize_va_space = 2

# SysRq only for secure attention key (0 = only Alt+SysRq through keyboard
# with value 1 needed; 0 disables most of it).
kernel.sysrq = 0

# Restrict perf events to privileged users.
kernel.perf_event_paranoid = 2

# Never produce core dumps of SUID/SGID binaries.
fs.suid_dumpable = 0

# BPF JIT hardening.
net.core.bpf_jit_harden = 2

### --- Filesystem protections ---------------------------------------------

# Don't follow symlinks in world-writable sticky dirs (e.g. /tmp race).
fs.protected_symlinks = 1
# Don't allow hardlinks to files the user does not own.
fs.protected_hardlinks = 1
# Protect FIFOs / regular files in sticky world-writable dirs.
fs.protected_fifos = 2
fs.protected_regular = 2

# Managed by safeset (safesetsh). Drop-in; first-obtained wins in sshd, and
# Debian's sshd_config includes this directory at the top of the config.

# --- Authentication -------------------------------------------------------
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
UsePAM yes
PermitUserEnvironment no
PermitUserRC no
IgnoreRhosts yes
HostbasedAuthentication no

# --- Access lists / port (rendered) ---------------------------------------
@PORT_LINE@
@ALLOW_USERS_LINE@

# --- Forwarding (rendered: no by default, --keep-forwarding overrides) ----
X11Forwarding @X11_FORWARDING@
AllowAgentForwarding @AGENT_FORWARDING@
AllowTcpForwarding @TCP_FORWARDING@
PermitTunnel no
GatewayPorts no

# --- Session limits / robustness ------------------------------------------
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 3:50:10
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive yes
MaxSessions 10

# --- Modern algorithms only -----------------------------------------------
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256

# --- Disclosure minimisation ----------------------------------------------
Banner /etc/issue.net
PrintMotd no
DebianBanner no

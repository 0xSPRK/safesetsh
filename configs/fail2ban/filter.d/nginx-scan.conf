# Managed by safeset (safesetsh).
# Bans scanners probing for common secrets / admin panels. Matches the nginx
# access log (combined format); the web drop-in also returns 444 for these.

[Definition]
failregex = ^<HOST> -[^"]*"[A-Z]+ [^"]*(?:/\.env|/\.git|/\.svn|/\.aws|/\.ssh|/\.DS_Store|/wp-login\.php|/wp-admin|/wp-content/plugins|/xmlrpc\.php|/phpmyadmin|/pma|/myadmin|/mysqladmin|/administrator|/config\.php\.bak|/\.well-known/\.\.|/vendor/phpunit|/cgi-bin/luci|/actuator|/\.terraform)
ignoreregex =

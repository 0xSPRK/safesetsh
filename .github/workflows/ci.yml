name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar xJ
          sudo cp shellcheck-v0.11.0/shellcheck /usr/local/bin/
          shellcheck --version
      - name: Run shellcheck (strict)
        run: |
          set -euo pipefail
          files=$(find . -name "*.sh" | sort)
          shellcheck -x -S style "$files"
  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shfmt
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
          shfmt -d $(find . -name "*.sh" | sort)
  bats:
    runs-on: ubuntu-latest
    needs: [shellcheck, shfmt]
    strategy:
      matrix:
        debian: ["12", "13"]
    container: debian:${{ matrix.debian }}-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: apt-get update -y && apt-get install -y --no-install-recommends bats
      - name: Run bats tests
        run: bats tests/
  integration:
    runs-on: ubuntu-latest
    needs: [shellcheck, shfmt]
    strategy:
      matrix:
        debian: ["12-slim", "13-slim"]
    steps:
      - uses: actions/checkout@v4
      - name: Container integration smoke
        run: ci/container-smoke.sh "docker.io/library/debian:${{ matrix.debian }}"
